];

const labels={wedding:"Свадьба",birthday:"День рождения / юбилей",corporate:"Корпоратив"};
const typeLabels={estate:"Усадьба / вилла",restaurant:"Ресторан / банкет",hotel:"Отель / клуб",loft:"Лофт / event",hall:"Event-зал",greenhouse:"Оранжерея / стеклянный зал",tent:"Шатёр",barn:"Амбар",water:"У воды",terrace:"Терраса / природа",historic:"Историческая площадка"};
const grid=document.getElementById('grid');
let activeType='all',lightboxVenue=null,lightboxIndex=0,returnFocusElement=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function filtered(){
  return venues.filter(v=>activeType==='all'||v.types.includes(activeType));
}
function updateButtons(selector,key,value){document.querySelectorAll(selector).forEach(button=>{const active=button.dataset[key]===value;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active));});}
function card(v){const main=v.images?.[0];const image=main?`<img src="${esc(main.url)}" alt="${esc(v.name)} — фотография площадки" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:'';const badge=v.status==='confirmed'?`<span class="tag confirm">${esc(v.statusText||'Информация опубликована')}</span>`:`<span class="tag warn">${esc(v.statusText||'Уточнить условия')}</span>`;const eventTags=v.events.map(e=>`<span class="tag">${esc(labels[e]||e)}</span>`).slice(0,3).join('');const cap=v.capacity?`<span class="fact">Вместимость: <strong>до ${v.capacity}</strong></span>`:`<span class="fact">Вместимость: <strong>уточнить</strong></span>`;return `<article class="card"><div class="photo"><button class="photo-open" data-open="${v.id}" aria-label="Открыть фото площадки ${esc(v.name)}">${image}<div class="fallback">Фото временно недоступно.<br>Откройте источник или официальный сайт.</div><span class="galleryhint">${v.images.length>1?'Фото 1 из '+v.images.length:'Открыть фото'}</span></button><span class="distance">${esc(v.dist)}</span></div><div class="photocredit">Фото: <a href="${esc(main?.source||v.site)}" target="_blank" rel="noopener noreferrer">${esc(main?.credit||'источник')}</a></div><div class="content"><h3>${esc(v.name)}</h3><div class="place">⌖ ${esc(v.loc)}</div><p class="desc">${esc(v.desc)}</p><div class="facts">${cap}<span class="fact">Формат: <strong>${esc(typeLabels[v.types[0]]||'Площадка')}</strong></span></div><div class="tags">${badge}${eventTags}${v.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="actions"><a class="site" href="${esc(v.site)}" target="_blank" rel="noopener noreferrer">Сайт / подробности ↗</a>${v.images.length>1?`<button class="chip" data-open="${v.id}" aria-label="Открыть галерею">Галерея (${v.images.length})</button>`:''}</div></div></article>`}
function render(){const list=filtered();grid.innerHTML=list.length?list.map(card).join(''):'<div class="empty">По выбранным параметрам площадки не найдены. Измените фильтры или сбросьте их.</div>';document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openLightbox(Number(el.dataset.open))));}
function openLightbox(id){lightboxVenue=venues.find(v=>v.id===id);lightboxIndex=0;if(!lightboxVenue||!lightboxVenue.images?.length)return;returnFocusElement=document.activeElement;showLightboxImage();const dialog=document.getElementById('lightbox');dialog.classList.add('open');document.body.style.overflow='hidden';document.getElementById('lightboxClose').focus();}
function showLightboxImage(){const imgs=lightboxVenue.images;document.getElementById('lightboxImage').src=imgs[lightboxIndex].url;document.getElementById('lightboxImage').alt=lightboxVenue.name;document.getElementById('lightboxCaption').innerHTML=`${esc(lightboxVenue.name)} · <a style="color:#b9d5ff" href="${esc(imgs[lightboxIndex].source||lightboxVenue.site)}" target="_blank" rel="noopener noreferrer">источник фото ↗</a>`;document.getElementById('imageCount').textContent=`${lightboxIndex+1} / ${imgs.length}`;document.getElementById('prevImage').disabled=lightboxIndex===0;document.getElementById('nextImage').disabled=lightboxIndex===imgs.length-1;}
function closeLightbox(){document.getElementById('lightbox').classList.remove('open');document.body.style.overflow='';lightboxVenue=null;const target=returnFocusElement;returnFocusElement=null;if(target&&target.isConnected&&typeof target.focus==='function')target.focus();}
document.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>{activeType=b.dataset.type;updateButtons('[data-type]','type',activeType);render()}));

document.getElementById('lightboxClose').addEventListener('click',closeLightbox);document.getElementById('lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox')closeLightbox()});document.getElementById('prevImage').addEventListener('click',()=>{if(lightboxIndex>0){lightboxIndex--;showLightboxImage()}});document.getElementById('nextImage').addEventListener('click',()=>{if(lightboxVenue&&lightboxIndex<lightboxVenue.images.length-1){lightboxIndex++;showLightboxImage()}});document.addEventListener('keydown',e=>{const dialog=document.getElementById('lightbox');if(!dialog.classList.contains('open'))return;if(e.key==='Escape'){closeLightbox();return;}if(e.key==='ArrowRight'){document.getElementById('nextImage').click();return;}if(e.key==='ArrowLeft'){document.getElementById('prevImage').click();return;}if(e.key==='Tab'){const focusable=[...dialog.querySelectorAll('button:not(:disabled),a[href]')];if(!focusable.length){e.preventDefault();return;}const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();
</script>
